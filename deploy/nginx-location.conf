# Place this location inside the existing port 80 server block.
# Keep its current server_name, default_server, and other locations unchanged.
# The trailing slash on proxy_pass removes /haidou-zhanji/ before forwarding.
location = /haidou-zhanji {
    access_log off;
    return 301 /haidou-zhanji/;
}

location ^~ /haidou-zhanji/ {
    access_log off;
    proxy_pass http://127.0.0.1:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 75s;
}
